<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareerNexa</title>

<style>
:root{
  --p:#8b5cf6;
  --k:#ec4899;
  --bg:#faf7ff;
  --ink:#30213f;
  --line:#eadff3
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at 90% 0,#ffe8f3,transparent 28%),var(--bg);
  font:15px system-ui;
  color:var(--ink)
}

button,input,select,textarea{font:inherit}

button{
  cursor:pointer;
  border:0;
  border-radius:11px;
  padding:10px 13px;
  font-weight:700
}

.primary{
  background:linear-gradient(120deg,var(--p),var(--k));
  color:white
}

.soft{
  background:#f2eaff;
  color:#6d28d9
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white
}

label{
  display:block;
  margin:12px 0 5px;
  font-weight:700;
  font-size:13px
}

.layout{
  display:grid;
  grid-template-columns:250px 1fr;
  min-height:100vh
}

.side{
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  background:#ffffffd9;
  border-right:1px solid var(--line);
  padding:20px 14px
}

.brand{
  font-size:23px;
  font-weight:900;
  padding:5px 10px 20px
}

.brand b{color:var(--k)}

.group{
  font-size:10px;
  letter-spacing:1.5px;
  color:#a197ad;
  font-weight:900;
  padding:16px 10px 5px
}

.nav button{
  display:block;
  text-align:left;
  width:100%;
  background:transparent;
  color:#645873;
  margin:3px 0
}

.nav button.active,
.nav button:hover{
  background:linear-gradient(90deg,#f0e9ff,#fff0f7);
  color:#6d28d9
}

.main{
  padding:26px;
  max-width:1500px;
  width:100%;
  margin:auto
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}

.top h1{margin:0}

.card{
  background:#ffffffdf;
  border:1px solid var(--line);
  border-radius:17px;
  padding:19px;
  margin-bottom:14px;
  box-shadow:0 8px 25px #58366a08
}

.hero{
  background:linear-gradient(120deg,#f1eaff,#fff0f7);
  padding:28px;
  border-radius:22px;
  margin-bottom:18px
}

.hero h2{
  font-size:34px;
  line-height:1.1;
  margin:8px 0
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px
}

.muted{color:#786d83}

.tag{
  display:inline-block;
  background:#f3e8ff;
  color:#7e22ce;
  border-radius:99px;
  padding:4px 8px;
  font-size:11px;
  margin:2px
}

.job h3{margin:5px 0}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px
}

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:8px;
  margin:12px 0
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between
}

.notice{
  background:#fff0f7;
  color:#9d174d;
  padding:12px;
  border-radius:10px;
  margin:12px 0
}

.ok{
  background:#ecfdf5;
  color:#047857
}

.hidden{display:none}

.auth{
  max-width:440px;
  margin:8vh auto
}

.auth .card{padding:28px}

.list{
  padding:12px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between
}

.list:last-child{border:0}

.small{font-size:12px}

@media(max-width:950px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }

  .toolbar{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:680px){
  .layout{display:block}

  .side{
    position:relative;
    height:auto
  }

  .nav{
    display:flex;
    overflow:auto;
    gap:4px
  }

  .group{display:none}

  .nav button{
    white-space:nowrap;
    width:auto
  }

  .main{padding:14px}

  .grid{
    grid-template-columns:1fr
  }

  .toolbar{
    grid-template-columns:1fr
  }

  .hero h2{
    font-size:27px
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const $=s=>document.querySelector(s);

const esc=s=>String(s??"").replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

let token=localStorage.cnToken||"";
let user=null;
let profile={};
let jobs=[];
let saved=[];
let apps=[];
let page="Home";


/* =========================
   API HELPER
========================= */

async function api(url,opt={}){
  let h={...(opt.headers||{})};

  if(token){
    h.Authorization="Bearer "+token;
  }

  if(
    opt.body &&
    !(opt.body instanceof FormData)
  ){
    h["Content-Type"]="application/json";
  }

  let r;

  try{
    r=await fetch(url,{
      ...opt,
      headers:h
    });
  }catch(e){
    throw Error("Unable to connect to server.");
  }

  let d;

  try{
    d=await r.json();
  }catch{
    d={};
  }

  if(!r.ok){
    throw Error(d.error||"Request failed");
  }

  return d;
}


/* =========================
   LOGIN / REGISTER
========================= */

function auth(mode="login"){

  let reg=mode==="register";

  $("#app").innerHTML=`
    <div class="auth">
      <div class="card">

        <div class="brand">
          Career<b>Nexa</b> ✦
        </div>

        <h1>${reg?"Create account":"Welcome back"}</h1>

        <p class="muted">
          ${reg
            ?"Start building your career profile."
            :"Log in to your career workspace."
          }
        </p>

        <div id="msg" class="notice hidden"></div>

        <form id="form">

          ${
            reg
            ?'<label>Name</label><input name="name" required>'
            :""
          }

          <label>Email</label>

          <input
            name="email"
            type="email"
            required
          >

          <label>Password</label>

          <input
            name="password"
            type="password"
            minlength="8"
            required
          >

          <button
            class="primary"
            style="width:100%;margin-top:16px"
          >
            ${reg?"Create account":"Log in"}
          </button>

        </form>

        <p>
          ${reg?"Already have an account?":"New here?"}
          <a href="#" id="switch">
            ${reg?"Log in":"Create account"}
          </a>
        </p>

      </div>
    </div>
  `;

  $("#switch").onclick=e=>{
    e.preventDefault();
    auth(reg?"login":"register");
  };

  $("#form").onsubmit=async e=>{

    e.preventDefault();

    try{

      let d=await api(
        "/api/"+(reg?"register":"login"),
        {
          method:"POST",
          body:JSON.stringify(
            Object.fromEntries(
              new FormData(e.target)
            )
          )
        }
      );

      token=d.token;

      localStorage.cnToken=token;

      user=d.user;

      await load();

      render();

    }catch(x){

      $("#msg").textContent=x.message;

      $("#msg").classList.remove("hidden");

    }

  };

}


/* =========================
   LOAD DATA
========================= */

async function load(){

  [user,jobs,saved,apps]=await Promise.all([
    api("/api/me"),
    api("/api/jobs"),
    api("/api/saved"),
    api("/api/applications")
  ]);

  profile=user;
}


/* =========================
   NAVIGATION
========================= */

const nav=[
  ["WORKSPACE","Home","Find Jobs","Saved Jobs","Applications"],
  ["GROW","Resume AI","Interview Prep","Skill Gap","Learning Hub","Career Roadmap"],
  ["TOOLS","Resume Builder","Portfolio","Career Analytics","AI Career Coach"],
  ["ACCOUNT","Profile","Log out"]
];


/* =========================
   MAIN SHELL
========================= */

function shell(body){

  $("#app").innerHTML=`

    <div class="layout">

      <aside class="side">

        <div class="brand">
          Career<b>Nexa</b> ✦
        </div>

        <div class="nav">

          ${nav.map(g=>`

            <div class="group">
              ${g[0]}
            </div>

            ${g.slice(1).map(n=>`

              <button
                data-page="${n}"
                class="${page===n?"active":""}"
              >

                ${
                  ({
                    "Home":"⌂",
                    "Find Jobs":"⌕",
                    "Saved Jobs":"♡",
                    "Applications":"▤",
                    "Resume AI":"▧",
                    "Interview Prep":"◉",
                    "Skill Gap":"◇",
                    "Learning Hub":"▱",
                    "Career Roadmap":"↗",
                    "Resume Builder":"✎",
                    "Portfolio":"▣",
                    "Career Analytics":"▥",
                    "AI Career Coach":"✧",
                    "Profile":"◎",
                    "Log out":"↪"
                  })[n]
                }

                &nbsp; ${n}

              </button>

            `).join("")}

          `).join("")}

        </div>

      </aside>

      <main class="main">

        <div class="top">

          <h1>${esc(page)}</h1>

          <span class="tag">
            ${esc(user.name||user.email)}
          </span>

        </div>

        <div id="toast" class="notice hidden"></div>

        ${body}

      </main>

    </div>
  `;


  document
    .querySelectorAll("[data-page]")
    .forEach(b=>{

      b.onclick=()=>{

        if(b.dataset.page==="Log out"){

          token="";

          localStorage.removeItem("cnToken");

          user=null;

          auth();

          return;
        }

        page=b.dataset.page;

        render();

      };

    });

}


/* =========================
   JOB CARD
========================= */

function job(j){

  const alreadyApplied=
    apps.some(a=>Number(a.job_id)===Number(j.id));

  return `

    <div class="card job">

      <span class="tag">
        ${esc(j.level)}
      </span>

      <h3>
        ${esc(j.title)}
      </h3>

      <div class="muted">
        ${esc(j.company)} · ${esc(j.location)}
      </div>

      <p>
        ${esc(j.description)}
      </p>

      <div>

        ${j.skills.map(s=>`
          <span class="tag">
            ${esc(s)}
          </span>
        `).join("")}

      </div>

      <p>
        <b>${esc(j.salary)}</b>
        ·
        ${esc(j.type)}
      </p>

      <div class="actions">

        <button
          class="primary"
          data-apply="${j.id}"
          ${alreadyApplied?"disabled":""}
        >
          ${alreadyApplied
            ?"✅ Applied"
            :"Apply / Track"
          }
        </button>

        <button
          class="soft"
          data-save="${j.id}"
        >
          ${
            saved.includes(j.id)
            ?"♥ Saved"
            :"♡ Save"
          }
        </button>

        <button
          class="soft"
          data-match="${j.id}"
        >
          Match
        </button>

      </div>

    </div>
  `;
}


/* =========================
   HOME
========================= */

function home(){

  return `

    <div class="hero">

      <span class="tag">
        YOUR CAREER, YOUR NEXT MOVE
      </span>

      <h2>
        Grow your career with confidence.
      </h2>

      <p>
        Discover jobs, track applications,
        improve your resume, and practice interviews.
      </p>

      <button
        class="primary"
        data-page="Find Jobs"
      >
        Explore jobs →
      </button>

    </div>


    <div class="grid">

      <div class="card">
        <b>${saved.length}</b>
        <div class="muted">
          Saved jobs
        </div>
      </div>

      <div class="card">
        <b>${apps.length}</b>
        <div class="muted">
          Applications
        </div>
      </div>

      <div class="card">
        <b>
          ${
            (profile.skills||"")
            .split(",")
            .filter(Boolean)
            .length
          }
        </b>

        <div class="muted">
          Profile skills
        </div>
      </div>

    </div>


    <h2>
      Fresher-friendly jobs
    </h2>

    <div class="grid">

      ${
        jobs
          .filter(
            j=>j.level==="Fresher"||
               j.level==="0–1 years"
          )
          .slice(0,3)
          .map(job)
          .join("")
      }

    </div>
  `;
}


/* =========================
   JOB SEARCH
========================= */

function jobsPage(){

  return `

    <div class="card">

      <h2>
        Find jobs
      </h2>

      <p class="muted">
        Sample jobs are included.
        Connect a live job provider to show
        real-time vacancies.
      </p>


      <div class="toolbar">

        <input
          id="q"
          placeholder="Search role or skill"
        >

        <select id="level">

          <option value="">
            All experience
          </option>

          <option>
            Fresher
          </option>

          <option>
            0–1 years
          </option>

          <option>
            2+ years
          </option>

        </select>


        <input
          id="loc"
          placeholder="Location"
        >


        <select id="type">

          <option value="">
            All types
          </option>

          <option>
            Internship
          </option>

          <option>
            Full-time
          </option>

          <option>
            Trainee
          </option>

        </select>


        <button
          class="primary"
          id="search"
        >
          Search
        </button>

      </div>


      <div
        id="results"
        class="grid"
      >
        ${jobs.map(job).join("")}
      </div>

    </div>
  `;
}


/* =========================
   APPLICATIONS
========================= */

function applications(){

  return `

    <div class="card">

      <h2>
        Application tracker
      </h2>

      ${
        apps.length

        ?

        apps.map(a=>`

          <div class="list">

            <div>

              <b>
                ${esc(a.job?.title||"Job")}
              </b>

              <div class="muted small">
                ${esc(a.job?.company||"")}
              </div>

            </div>


            <select
              data-status="${a.id}"
              style="max-width:140px"
            >

              ${
                [
                  "Applied",
                  "Assessment",
                  "Interview",
                  "Offer",
                  "Rejected",
                  "Withdrawn"
                ]
                .map(
                  s=>`
                    <option
                      ${a.status===s?"selected":""}
                    >
                      ${s}
                    </option>
                  `
                )
                .join("")
              }

            </select>


            <button
              data-delete="${a.id}"
              class="soft"
            >
              Remove
            </button>

          </div>

        `).join("")

        :

        "No applications yet. Apply to a job to track it."

      }

    </div>
  `;
}


/* =========================
   PROFILE
========================= */

function profilePage(){

  return `

    <div class="card">

      <h2>
        Your profile
      </h2>

      <form id="pf">

        <label>
          Name
        </label>

        <input
          name="name"
          value="${esc(profile.name)}"
        >


        <label>
          Experience
        </label>

        <select name="experience">

          <option
            ${profile.experience==="Fresher"?"selected":""}
          >
            Fresher
          </option>

          <option>
            Experienced
          </option>

          <option>
            Career Switch
          </option>

          <option>
            Internship
          </option>

        </select>


        <label>
          Target role
        </label>

        <input
          name="role"
          value="${esc(profile.role||"")}"
        >


        <label>
          Location
        </label>

        <input
          name="location"
          value="${esc(profile.location||"")}"
        >


        <label>
          Skills (comma-separated)
        </label>

        <textarea
          name="skills"
          rows="3"
        >${esc(profile.skills||"")}</textarea>


        <button class="primary">

        </button>

    </div>
  `;

/* =========================
   OTHER FEATURES
========================= */

function other(){

  if(page==="Resume AI")

    return `

      <div class="card">

        <h2>
          Resume analyzer
        </h2>

        <p class="muted">
          Upload PDF/DOC/TXT up to 5 MB.
          Basic text checks work for TXT/MD;
          PDF/DOCX upload is recorded but needs
          a parser for text extraction.
        </p>

        <form id="resume">

          <input
            type="file"
            name="resume"
            required
            accept=".pdf,.doc,.docx,.txt,.md"
          >

          <button
            class="primary"
            style="margin-top:12px"
          >
            Analyze
          </button>

        </form>

        <div id="out"></div>

      </div>
    `;


  if(page==="Interview Prep")

    return `

      <div class="card">

        <h2>
          Mock interview practice
        </h2>

        <p>
          Answer five questions, then receive
          a practice score and feedback.
        </p>

        <div id="questions">

          <b id="question"></b>

          <textarea
            id="answer"
            rows="5"
          ></textarea>

          <button
            class="primary"
            id="next"
          >
            Save & next
          </button>

        </div>

        <div id="result"></div>

      </div>
    `;


  if(page==="Skill Gap")

    return `

      <div class="card">

        <h2>
          Skill gap analyzer
        </h2>

        <label>
          Skills you have
        </label>

        <input
          id="have"
          value="${esc(
            profile.skills||
            "HTML, CSS, JavaScript, React"
          )}"
        >

        <label>
          Target job skills
        </label>

        <input
          id="need"
          value="HTML, CSS, JavaScript, React, TypeScript, Testing"
        >

        <button
          id="compare"
          class="primary"
        >
          Compare skills
        </button>

        <div id="gap"></div>

      </div>
    `;


  let desc={

    "Learning Hub":
      "Build a weekly plan: learn a concept, practice it, then build a small project.",

    "Career Roadmap":
      "Choose a role → identify skills → build projects → improve resume → practice interviews → apply and track.",

    "Resume Builder":
      "Create a resume with contact details, summary, education, skills, projects, and achievements. Tailor it to each job.",

    "Portfolio":
      "Showcase 2–3 projects, your role, tools used, outcomes, skills, and contact links.",

    "Career Analytics":
      `You have saved ${saved.length} jobs and tracked ${apps.length} applications. Update statuses to keep your progress accurate.`,

    "AI Career Coach":
      "Use this guided planner to create next steps. This starter does not connect to a generative AI API."

  };


  return `

    <div class="card">

      <h2>
        ${esc(page)}
      </h2>

      <p>
        ${esc(
          desc[page]||
          "Update your career profile and explore relevant opportunities."
        )}
      </p>

      ${
        page==="AI Career Coach"

        ?

        `
          <form id="coach">

            <label>
              What do you need help with?
            </label>

            <textarea
              name="q"
              rows="3"
              placeholder="I am a fresher looking for frontend jobs..."
            ></textarea>

            <button class="primary">
              Get a plan
            </button>

          </form>

          <div id="coachout"></div>
        `

        :

        `
          <button
            class="primary"
            data-page="Find Jobs"
          >
            Explore jobs
          </button>

          <button
            class="soft"
            data-page="Profile"
          >
            Update profile
          </button>
        `
      }

    </div>
  `;
}


/* =========================
   INTERVIEW
========================= */

let qi=0;

let answers=[];

let questions=[
  "Tell me about yourself.",
  "Describe a project you are proud of.",
  "What technical challenge did you solve?",
  "Why this role?",
  "What are you improving?"
];


/* =========================
   RENDER
========================= */

async function render(){

  if(!token){
    auth();
    return;
  }

  try{

    if(!user)
      await load();

  }catch{

    token="";

    localStorage.removeItem("cnToken");

    auth();

    return;
  }


  let body=

    page==="Home"
      ?home()

    :page==="Find Jobs"
      ?jobsPage()

    :page==="Saved Jobs"
      ?`
        <div class="grid">

          ${
            jobs
              .filter(j=>saved.includes(j.id))
              .map(job)
              .join("")
            ||
            '<div class="card">No saved jobs yet.</div>'
          }

        </div>
      `

    :page==="Applications"
      ?applications()

    :page==="Profile"
      ?profilePage()

    :other();


  shell(body);

  wire();
}


/* =========================
   TOAST
========================= */

function toast(s){

  let t=$("#toast");

  if(t){

    t.textContent=s;

    t.classList.remove("hidden");

    setTimeout(
      ()=>t.classList.add("hidden"),
      3500
    );

  }

}


/* =========================
   EVENT HANDLERS
========================= */

function wire(){

  /* NAVIGATION */

  document
    .querySelectorAll("[data-page]")
    .forEach(b=>{

      b.onclick=()=>{
        page=b.dataset.page;
        render();
      };

    });


  /* SAVE JOB */

  document
    .querySelectorAll("[data-save]")
    .forEach(b=>{

      b.onclick=async()=>{

        try{

          await api(
            "/api/saved/"+b.dataset.save,
            {
              method:"POST"
            }
          );

          await load();

          render();

          toast("Job saved successfully");

        }catch(e){

          toast(e.message);

        }

      };

    });


  /* =========================
     APPLY JOB - FIXED
  ========================= */

  document
    .querySelectorAll("[data-apply]")
    .forEach(b=>{

      b.onclick=async()=>{

        try{

          /* Prevent double clicking */

          b.disabled=true;

          b.textContent="Applying...";


          /* Send application */

          await api(
            "/api/applications/"+b.dataset.apply,
            {
              method:"POST"
            }
          );


          /* Reload applications */

          await load();


          /* Re-render with Applied button */

          render();


          /* Show success message */

          setTimeout(
            ()=>{
              toast("✅ Application added to tracker");
            },
            50
          );


        }catch(e){

          /* Restore button */

          b.disabled=false;

          b.textContent="Apply / Track";

          toast(
            "❌ "+e.message
          );

        }

      };

    });


  /* MATCH */

  document
    .querySelectorAll("[data-match]")
    .forEach(b=>{

      b.onclick=()=>{

        let j=jobs.find(
          x=>x.id===+b.dataset.match
        );

        let have=
          (profile.skills||"")
          .toLowerCase()
          .split(",")
          .map(x=>x.trim());


        let match=j.skills.filter(
          x=>have.includes(
            x.toLowerCase()
          )
        );


        let miss=j.skills.filter(
          x=>!have.includes(
            x.toLowerCase()
          )
        );


        alert(
          `${j.title}\n`+
          `Skill overlap: ${
            Math.round(
              match.length/
              j.skills.length*
              100
            )
          }%\n`+
          `Matched: ${
            match.join(", ")||"None"
          }\n`+
          `Missing: ${
            miss.join(", ")||"None"
          }`
        );

      };

    });


  /* APPLICATION STATUS */

  document
    .querySelectorAll("[data-status]")
    .forEach(s=>{

      s.onchange=async()=>{

        try{

          await api(
            "/api/applications/"+s.dataset.status,
            {
              method:"PATCH",
              body:JSON.stringify({
                status:s.value
              })
            }
          );

          await load();

          toast("Status updated");

        }catch(e){

          toast(e.message);

        }

      };

    });


  /* DELETE APPLICATION */

  document
    .querySelectorAll("[data-delete]")
    .forEach(b=>{

      b.onclick=async()=>{

        try{

          await api(
            "/api/applications/"+b.dataset.delete,
            {
              method:"DELETE"
            }
          );

          await load();

          render();

          toast("Application removed");

        }catch(e){

          toast(e.message);

        }

      };

    });


  /* SEARCH */

  if($("#search"))

    $("#search").onclick=async()=>{

      try{

        let p=new URLSearchParams({

          q:$("#q").value,

          level:$("#level").value,

          location:$("#loc").value,

          type:$("#type").value

        });


        let list=await api(
          "/api/jobs?"+p
        );


        $("#results").innerHTML=
          list.map(job).join("")
          ||
          '<div class="card">No matching jobs</div>';


        wire();

      }catch(e){

        toast(e.message);

      }

    };


  /* PROFILE */

  if($("#pf"))

    $("#pf").onsubmit=async e=>{

      e.preventDefault();

      try{

        profile=await api(
          "/api/profile",
          {
            method:"PUT",
            body:JSON.stringify(
              Object.fromEntries(
                new FormData(e.target)
              )
            )
          }
        );

        user.name=profile.name;

        toast("Profile saved");

        render();

      }catch(e){

        toast(e.message);

      }

    };


  /* RESUME */

  if($("#resume"))

    $("#resume").onsubmit=async e=>{

      e.preventDefault();

      let fd=new FormData(e.target);

      $("#out").textContent=
        "Analyzing…";


      try{

        let d=await api(
          "/api/resume",
          {
            method:"POST",
            body:fd
          }
        );


        $("#out").innerHTML=`

          <div class="notice ok">

            Score:
            ${d.analysis.score}/100

            <br>

            ${esc(d.note)}

          </div>

          ${
            d.analysis.checks
              .map(x=>`

                <div class="list">

                  ${esc(x[0])}

                  <b>
                    ${x[1]?"Found":"Review"}
                  </b>

                </div>

              `)
              .join("")
          }

          <p>
            ${
              d.analysis.suggestions
                .map(esc)
                .join("<br>")
            }
          </p>

        `;

      }catch(x){

        $("#out").textContent=
          x.message;

      }

    };


  /* INTERVIEW */

  if($("#next")){

    const setq=()=>{

      $("#question").textContent=
        `Question ${qi+1}/5: ${questions[qi]}`;

      $("#answer").value=
        answers[qi]||"";

    };


    setq();


    $("#next").onclick=async()=>{

      answers[qi]=
        $("#answer").value;


      if(qi<4){

        qi++;

        setq();

      }else{

        try{

          let d=await api(
            "/api/interview",
            {
              method:"POST",
              body:JSON.stringify({
                role:profile.role,
                answers
              })
            }
          );


          $("#questions")
            .classList
            .add("hidden");


          $("#result").innerHTML=`

            <h2>
              Practice score:
              ${d.score}/100
            </h2>

            <p>
              ${esc(d.feedback)}
            </p>

            <button
              class="primary"
              id="again"
            >
              Practice again
            </button>

          `;


          $("#again").onclick=()=>{

            qi=0;

            answers=[];

            render();

          };


        }catch(e){

          toast(e.message);

        }

      }

    };

  }


  /* SKILL GAP */

  if($("#compare"))

    $("#compare").onclick=()=>{

      let h=
        $("#have")
        .value
        .toLowerCase()
        .split(",")
        .map(x=>x.trim());


      let n=
        $("#need")
        .value
        .split(",")
        .map(x=>x.trim());


      let m=n.filter(
        x=>!h.includes(
          x.toLowerCase()
        )
      );


      $("#gap").innerHTML=`

        <div class="notice">
          Matched
          ${n.length-m.length}/${n.length}
          skills
        </div>

        <b>
          Skills to learn:
        </b>

        ${
          m.map(esc).join(", ")
          ||
          "No gaps found"
        }

      `;

    };


  /* AI COACH */

  if($("#coach"))

    $("#coach").onsubmit=e=>{

      e.preventDefault();

      $("#coachout").innerHTML=`

        <div class="notice">

          1. Pick one target role.
          <br>
          2. Compare 5 job descriptions.
          <br>
          3. Choose one missing skill.
          <br>
          4. Build a project that proves it.
          <br>
          5. Update your resume and apply
          to suitable roles.

        </div>

      `;

    };

}


/* =========================
   START APPLICATION
========================= */

render();

</script>

</body>
</html>
