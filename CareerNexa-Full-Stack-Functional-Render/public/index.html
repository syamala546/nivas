<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CareerNexa</title>

<style>
:root{
  --pink:#e11d72;
  --pink2:#be185d;
  --lav:#fdf2f8;
  --purple:#7c3aed;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#eadde5;
  --white:#ffffff;
  --green:#059669;
  --red:#dc2626;
  --shadow:0 10px 35px rgba(31,41,55,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:#faf8fb;
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:var(--pink);
  text-decoration:none;
}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

/* =====================================================
   TOP MESSAGE
===================================================== */

.top-message{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:99999;
  min-width:320px;
  max-width:90%;
  padding:14px 20px;
  border-radius:12px;
  background:#111827;
  color:white;
  text-align:center;
  font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.top-message.success{
  background:#059669;
}

.top-message.error{
  background:#dc2626;
}

.top-message.info{
  background:#7c3aed;
}

/* =====================================================
   COMMON
===================================================== */

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.primary{
  border:0;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  color:white;
  padding:11px 17px;
  border-radius:10px;
  font-weight:700;
}

.primary:hover{
  opacity:.93;
}

.secondary{
  border:1px solid #e5d5df;
  background:white;
  color:#374151;
  padding:10px 15px;
  border-radius:10px;
  font-weight:600;
}

.secondary:hover{
  background:#fff7fb;
}

.danger{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  padding:10px 14px;
  border-radius:10px;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #ddd4dc;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  background:white;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(225,29,114,.08);
}

textarea{
  min-height:120px;
  resize:vertical;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:14px 0 7px;
}

.notice{
  padding:12px;
  border-radius:10px;
  margin:12px 0;
  background:#fff0f7;
  color:#9d174d;
}

.ok{
  background:#ecfdf5;
  color:#047857;
}

/* =====================================================
   AUTH
===================================================== */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    radial-gradient(circle at top left,#fce7f3,transparent 35%),
    radial-gradient(circle at bottom right,#ede9fe,transparent 35%),
    #faf8fb;
}

.auth .card{
  width:100%;
  max-width:440px;
  padding:32px;
}

.brand{
  font-size:25px;
  font-weight:800;
  color:#111827;
  margin-bottom:20px;
}

.brand b{
  color:var(--pink);
}

.auth h1{
  margin:5px 0 8px;
  font-size:30px;
}

.auth p{
  line-height:1.5;
}

/* =====================================================
   APP LAYOUT
===================================================== */

.layout{
  min-height:100vh;
  display:grid;
  grid-template-columns:245px 1fr;
}

.side{
  position:sticky;
  top:0;
  height:100vh;
  background:#fff;
  border-right:1px solid var(--line);
  padding:20px 14px;
  overflow:auto;
}

.side .brand{
  padding:5px 10px 20px;
  margin:0;
}

.userbox{
  background:#fff7fb;
  border:1px solid #f6d7e7;
  border-radius:14px;
  padding:12px;
  margin-bottom:16px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fce7f3;
  color:var(--pink2);
  font-weight:800;
}

.userrow{
  display:flex;
  gap:10px;
  align-items:center;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  color:#4b5563;
  font-weight:600;
}

.nav button:hover{
  background:#fff0f7;
  color:var(--pink2);
}

.nav button.active{
  background:#fce7f3;
  color:var(--pink2);
}

.group{
  font-size:11px;
  color:#9ca3af;
  font-weight:800;
  text-transform:uppercase;
  padding:14px 12px 5px;
}

.main{
  min-width:0;
  padding:25px;
}

/* =====================================================
   HEADER
===================================================== */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.topbar h1{
  margin:0;
  font-size:28px;
}

.topbar p{
  margin:5px 0 0;
}

.hero{
  background:
    linear-gradient(135deg,#fce7f3,#f5f3ff);
  border:1px solid #f2dce8;
  border-radius:22px;
  padding:28px;
  margin-bottom:22px;
}

.hero h2{
  margin:0 0 8px;
  font-size:32px;
}

.hero p{
  color:#6b7280;
  max-width:700px;
}

/* =====================================================
   GRIDS
===================================================== */

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.stat{
  padding:20px;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.section{
  margin-top:24px;
}

.section h2{
  margin:0 0 14px;
}

/* =====================================================
   JOBS
===================================================== */

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

.job{
  padding:18px;
  display:flex;
  flex-direction:column;
  min-height:290px;
}

.job-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.job h3{
  margin:0 0 6px;
  font-size:18px;
}

.company{
  color:#6b7280;
  font-weight:600;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0;
}

.tag{
  background:#f5f3ff;
  color:#6d28d9;
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}

.level{
  display:inline-block;
  background:#ecfdf5;
  color:#047857;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}

.job-desc{
  color:#6b7280;
  line-height:1.5;
  flex:1;
}

.job-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

/* =====================================================
   APPLICATIONS
===================================================== */

.application{
  padding:18px;
  margin-bottom:12px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#f3f4f6;
  font-size:11px;
  font-weight:800;
}

.status.Applied{
  background:#eff6ff;
  color:#1d4ed8;
}

.status.Assessment{
  background:#fff7ed;
  color:#c2410c;
}

.status.Interview{
  background:#f5f3ff;
  color:#6d28d9;
}

.status.Offer{
  background:#ecfdf5;
  color:#047857;
}

.status.Rejected{
  background:#fef2f2;
  color:#b91c1c;
}

/* =====================================================
   PROFILE
===================================================== */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.profile-card{
  padding:22px;
}

/* =====================================================
   RESUME
===================================================== */

.upload{
  padding:25px;
  text-align:center;
  border:2px dashed #e8c9d9;
  border-radius:16px;
  background:#fffafd;
}

/* =====================================================
   INTERVIEW
===================================================== */

.question{
  padding:18px;
  margin-bottom:14px;
}

.question h3{
  margin-top:0;
}

/* =====================================================
   RECRUITER
===================================================== */

.form-card{
  padding:22px;
}

.list{
  padding:14px 0;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
}

.list:last-child{
  border:0;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
  padding:40px 20px;
  text-align:center;
  color:#6b7280;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:950px){

  .layout{
    grid-template-columns:190px 1fr;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .toolbar{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:680px){

  .layout{
    display:block;
  }

  .side{
    position:relative;
    height:auto;
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .nav{
    flex-direction:row;
    overflow:auto;
  }

  .nav button{
    white-space:nowrap;
  }

  .group{
    display:none;
  }

  .main{
    padding:14px;
  }

  .grid,
  .grid2,
  .form-grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .hero h2{
    font-size:26px;
  }

  .top-message{
    min-width:260px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="topMessage" class="top-message hidden"></div>

<script>

/* =====================================================
   GLOBAL STATE
===================================================== */

const $ = selector =>
  document.querySelector(selector);

const esc = value =>
  String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char])
  );

let token = localStorage.cnToken || "";

let user = null;
let profile = {};
let jobs = [];
let saved = [];
let apps = [];

let page = "Home";

let topMessageTimer = null;


/* =====================================================
   TOP MESSAGE
===================================================== */

function toast(message, type="success"){

  const box = $("#topMessage");

  if(!box){
    return;
  }

  box.textContent = message;

  box.classList.remove(
    "hidden",
    "success",
    "error",
    "info"
  );

  box.classList.add(type);

  clearTimeout(topMessageTimer);

  topMessageTimer = setTimeout(() => {
    box.classList.add("hidden");
  },3500);
}


/* =====================================================
   API
===================================================== */

async function api(url,opt={}){

  const headers = {
    ...(opt.headers || {})
  };

  if(token){
    headers.Authorization =
      "Bearer " + token;
  }

  if(
    opt.body &&
    !(opt.body instanceof FormData)
  ){
    headers["Content-Type"] =
      "application/json";
  }

  let response;

  try{

    response = await fetch(
      url,
      {
        ...opt,
        headers
      }
    );

  }catch(error){

    throw new Error(
      "Unable to connect to CareerNexa server."
    );
  }

  let data = {};

  try{
    data = await response.json();
  }catch{
    data = {};
  }

  if(!response.ok){

    if(response.status === 401){

      localStorage.removeItem("cnToken");
      token = "";

    }

    throw new Error(
      data.error || "Request failed."
    );
  }

  return data;
}


/* =====================================================
   AUTH PAGE
===================================================== */

function auth(mode="login"){

  const register =
    mode === "register";

  $("#app").innerHTML = `

    <div class="auth">

      <div class="card">

        <div class="brand">
          Career<b>Nexa</b> ✦
        </div>

        <h1>
          ${
            register
            ? "Create your account"
            : "Welcome back"
          }
        </h1>

        <p class="muted">
          ${
            register
            ? "Start building your career with CareerNexa."
            : "Log in to your CareerNexa workspace."
          }
        </p>

        <form id="authForm">

          ${
            register
            ? `
              <label>Name</label>
              <input
                name="name"
                placeholder="Enter your full name"
                required
              >

              <label>Account type</label>

              <select name="role">

                <option value="candidate">
                  Candidate
                </option>

                <option value="recruiter">
                  Recruiter
                </option>

              </select>
            `
            : ""
          }

          <label>Email</label>

          <input
            name="email"
            type="email"
            placeholder="you@example.com"
            required
          >

          <label>Password</label>

          <input
            name="password"
            type="password"
            minlength="8"
            placeholder="Minimum 8 characters"
            required
          >

          <button
            class="primary"
            style="width:100%;margin-top:18px"
            id="authButton"
          >
            ${
              register
              ? "Create account"
              : "Log in"
            }
          </button>

        </form>

        <p style="margin-top:18px">

          ${
            register
            ? "Already have an account?"
            : "New to CareerNexa?"
          }

          <a href="#" id="switchAuth">

            ${
              register
              ? "Log in"
              : "Create account"
            }

          </a>

        </p>

      </div>

    </div>
  `;


  $("#switchAuth").onclick = event => {

    event.preventDefault();

    auth(
      register
      ? "login"
      : "register"
    );

  };


  $("#authForm").onsubmit =
    async event => {

      event.preventDefault();

      const button =
        $("#authButton");

      button.disabled = true;

      button.textContent =
        register
        ? "Creating..."
        : "Logging in...";

      try{

        const form =
          new FormData(event.target);

        const body =
          Object.fromEntries(form);

        const result =
          await api(
            register
            ? "/api/register"
            : "/api/login",
            {
              method:"POST",
              body:JSON.stringify(body)
            }
          );

        token = result.token;

        localStorage.cnToken =
          token;

        user = result.user;

        toast(
          register
          ? "✅ Account created successfully!"
          : "✅ Login successful!",
          "success"
        );

        await load();

        page = "Home";

        render();

      }catch(error){

        toast(
          "❌ " + error.message,
          "error"
        );

        button.disabled = false;

        button.textContent =
          register
          ? "Create account"
          : "Log in";
      }

    };
}


/* =====================================================
   LOAD DATA
===================================================== */

async function load(){

  if(!token){
    return;
  }

  try{

    const results =
      await Promise.all([
        api("/api/me"),
        api("/api/jobs"),
        api("/api/saved"),
        api("/api/applications")
      ]);

    user = results[0];

    profile = results[0];

    jobs = Array.isArray(results[1])
      ? results[1]
      : [];

    saved = Array.isArray(results[2])
      ? results[2].map(Number)
      : [];

    apps = Array.isArray(results[3])
      ? results[3]
      : [];

  }catch(error){

    if(
      error.message.includes("Session expired") ||
      error.message.includes("Please log in")
    ){

      logout(false);

      return;
    }

    console.error(error);

    toast(
      "⚠️ " + error.message,
      "error"
    );
  }
}


/* =====================================================
   SHELL
===================================================== */

function shell(content){

  const role =
    user?.role || "candidate";

  const firstLetter =
    (user?.name || "U")
      .charAt(0)
      .toUpperCase();

  $("#app").innerHTML = `

    <div class="layout">

      <aside class="side">

        <div class="brand">
          Career<b>Nexa</b> ✦
        </div>

        <div class="userbox">

          <div class="userrow">

            <div class="avatar">
              ${esc(firstLetter)}
            </div>

            <div>

              <strong>
                ${esc(user?.name || "User")}
              </strong>

              <div class="small muted">
                ${esc(role)}
              </div>

            </div>

          </div>

        </div>


        <div class="nav">

          <div class="group">
            Main
          </div>

          ${navButton("Home","⌂")}
          ${navButton("Jobs","⌕")}
          ${navButton("Applications","✓")}
          ${navButton("Saved","♡")}

          <div class="group">
            Career Tools
          </div>

          ${navButton("Profile","◉")}
          ${navButton("Resume","▣")}
          ${navButton("Interview","★")}

          ${
            role === "recruiter"
            ? `
              <div class="group">
                Recruiter
              </div>

              ${navButton("Recruiter","▤")}
              `
            : ""
          }

          <div class="group">
            Account
          </div>

          <button id="logoutButton">
            ⇥ &nbsp; Logout
          </button>

        </div>

      </aside>


      <main class="main">

        ${content}

      </main>

    </div>
  `;


  $("#logoutButton").onclick =
    () => logout(true);

}


/* =====================================================
   NAV BUTTON
===================================================== */

function navButton(name,icon){

  return `

    <button
      data-page="${name}"
      class="${page === name ? "active" : ""}"
    >
      ${icon} &nbsp; ${name}
    </button>

  `;
}


/* =====================================================
   HOME
===================================================== */

function homePage(){

  const appliedCount =
    apps.length;

  const savedCount =
    saved.length;

  const fresherJobs =
    jobs.filter(
      j => String(j.level || "")
        .toLowerCase()
        .includes("fresher")
    ).length;

  return `

    <div class="topbar">

      <div>
        <h1>Dashboard</h1>

        <p class="muted">
          Welcome back, ${esc(user?.name || "there")} 👋
        </p>
      </div>

    </div>


    <div class="hero">

      <h2>
        Build your career with CareerNexa
      </h2>

      <p>
        Find relevant jobs, track applications,
        improve your resume and prepare for interviews
        — all in one place.
      </p>

      <button
        class="primary"
        data-page="Jobs"
      >
        Explore Jobs
      </button>

    </div>


    <div class="grid">

      <div class="card stat">
        <span class="muted">
          Available Jobs
        </span>

        <strong>
          ${jobs.length}
        </strong>
      </div>

      <div class="card stat">
        <span class="muted">
          Applications
        </span>

        <strong>
          ${appliedCount}
        </strong>
      </div>

      <div class="card stat">
        <span class="muted">
          Saved Jobs
        </span>

        <strong>
          ${savedCount}
        </strong>
      </div>

    </div>


    <div class="section">

      <h2>
        Quick career actions
      </h2>

      <div class="grid">

        <div class="card stat">

          <h3>
            🎯 Find Jobs
          </h3>

          <p class="muted">
            Search jobs based on your experience
            and skills.
          </p>

          <button
            class="secondary"
            data-page="Jobs"
          >
            Search jobs
          </button>

        </div>


        <div class="card stat">

          <h3>
            📄 Resume Analyzer
          </h3>

          <p class="muted">
            Upload your resume and find areas
            that need improvement.
          </p>

          <button
            class="secondary"
            data-page="Resume"
          >
            Analyze resume
          </button>

        </div>


        <div class="card stat">

          <h3>
            🎤 Mock Interview
          </h3>

          <p class="muted">
            Practice common interview questions
            and receive feedback.
          </p>

          <button
            class="secondary"
            data-page="Interview"
          >
            Start interview
          </button>

        </div>

      </div>

    </div>

  `;
}


/* =====================================================
   JOB PAGE
===================================================== */

function jobsPage(){

  return `

    <div class="topbar">

      <div>
        <h1>Find Jobs</h1>

        <p class="muted">
          Discover opportunities that match your career.
        </p>
      </div>

    </div>


    <div class="card" style="padding:16px">

      <div class="toolbar">

        <input
          id="jobSearch"
          placeholder="Search jobs, skills or companies..."
        >

        <select id="jobLevel">

          <option value="">
            All experience
          </option>

          <option value="Fresher">
            Fresher
          </option>

          <option value="0–1 years">
            0–1 years
          </option>

          <option value="2+ years">
            2+ years
          </option>

        </select>


        <input
          id="jobLocation"
          placeholder="Location"
        >


        <select id="jobType">

          <option value="">
            All job types
          </option>

          <option>
            Full-time
          </option>

          <option>
            Internship
          </option>

          <option>
            Trainee
          </option>

        </select>

      </div>

    </div>


    <div
      class="grid"
      id="jobGrid"
      style="margin-top:18px"
    >

      ${jobCards(jobs)}

    </div>

  `;
}


/* =====================================================
   JOB CARDS
===================================================== */

function jobCards(list){

  if(!list.length){

    return `
      <div
        class="card empty"
        style="grid-column:1/-1"
      >

    const alreadyApplied =
      apps.some(
        a =>

      );


    return `

          </div>

          <span class="level">
            ${esc(job.level || "Open")}
          </span>

        <p class="muted small">

          📍 ${esc(job.location || "Not specified")}

          &nbsp; • &nbsp;

          ${esc(job.type || "Full-time")}

        </p>


        <div class="tags">

          ${
            (job.skills || [])
              .map(
                skill =>
                  `<span class="tag">
                    ${esc(skill)}
                  </span>`
              )
              .join("")
          }

        </div>


        <p class="job-desc">
          ${esc(job.description || "No description available.")}
        </p>


        <strong>
          ${esc(job.salary || "Salary not specified")}
        </strong>


        <div class="job-actions">

          <button

            class="secondary"
            data-match="${job.id}"

            Skill Match

          <button
            class="primary"

              alreadyApplied
              ? "✓ Applied"
              : "Apply / Track"
            }

    `;

  }).join("");
}

function render(){

  if(!token || !user){

    auth("login");

    return;
  }


  let content = "";


  if(page === "Home"){
    content = homePage();
  }

  else if(page === "Jobs"){
    content = jobsPage();
  }

  else if(page === "Applications"){
    content = applicationsPage();
  }

  else if(page === "Saved"){
    content = savedPage();
  }

  else if(page === "Profile"){
    content = profilePage();
  }

  else if(page === "Resume"){
    content = resumePage();
  }

  else if(page === "Interview"){
    content = interviewPage();
  }

  else if(page === "Recruiter"){
    content = recruiterPage();
  }

  else{
    content = otherPage();
  }


  shell(content);

  wire();

}


/* =====================================================
   EVENT WIRING
===================================================== */

function wire(){

  /* NAVIGATION */

  document
    .querySelectorAll("[data-page]")
    .forEach(button => {

      button.onclick = () => {

        page =
          button.dataset.page;

        render();

      };

    });


  /* SAVE */

  document
    .querySelectorAll("[data-save]")
    .forEach(button => {

      button.onclick = async () => {

        button.disabled = true;

        try{

          const result =
            await api(
              "/api/saved/" +
              button.dataset.save,
              {
                method:"POST"
              }
            );

          await load();

          render();

          toast(
            result.message ||
            "Job saved successfully!",
            "success"
          );

        }catch(error){

          button.disabled = false;

          toast(
            "❌ " + error.message,
            "error"
          );

        }

      };

    });


  /* APPLY */

  document
    .querySelectorAll("[data-apply]")
    .forEach(button => {

      button.onclick = async () => {

        button.disabled = true;

        button.textContent =
          "Applying...";

        try{

          const result =
            await api(
              "/api/applications/" +
              button.dataset.apply,
              {
                method:"POST"
              }
            );

          await load();

          render();

          toast(
            result.message ||
            "✅ Application submitted successfully!",
            "success"
          );

        }catch(error){

          button.disabled = false;

          button.textContent =
            "Apply / Track";

          toast(
            "❌ " + error.message,
            "error"
          );

        }

      };

    });


  /* SKILL MATCH */

  document
    .querySelectorAll("[data-match]")
    .forEach(button => {

      button.onclick = () => {

        const job =
          jobs.find(
            x =>
              Number(x.id) ===
              Number(button.dataset.match)
          );

        if(!job){
          return;
        }

        const mySkills =
          String(profile.skills || "")
            .toLowerCase()
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

        const jobSkills =
          Array.isArray(job.skills)
          ? job.skills
          : [];

        const matched =
          jobSkills.filter(
            skill =>
              mySkills.includes(
                String(skill).toLowerCase()
              )
          );

        const missing =
          jobSkills.filter(
            skill =>
              !mySkills.includes(
                String(skill).toLowerCase()
              )
          );

        const percentage =
          jobSkills.length
          ? Math.round(
              matched.length /
              jobSkills.length *
              100
            )
          : 0;

        toast(
          `Skill match: ${percentage}%`,
          "info"
        );

        alert(
          job.title +
          "\n\n" +
          "Skill overlap: " +
          percentage +
          "%\n\n" +
          "Matched: " +
          (matched.join(", ") || "None") +
          "\n\n" +
          "Missing: " +
          (missing.join(", ") || "None")
        );

      };

    });


  /* APPLICATION STATUS */

  document
    .querySelectorAll("[data-status]")
    .forEach(button => {

      button.onclick = async () => {

        const parts =
          button.dataset.status.split("|");

        const id =
          parts[0];

        const status =
          parts[1];

        try{

          await api(
            "/api/applications/" + id,
            {
              method:"PATCH",
              body:JSON.stringify({
                status
              })
            }
          );

          await load();

          render();

          toast(
            "✅ Application status updated!",
            "success"
          );

        }catch(error){

          toast(
            "❌ " + error.message,
            "error"
          );

        }

      };

    });


  /* DELETE APPLICATION */

  document
    .querySelectorAll("[data-delete-app]")
    .forEach(button => {

      button.onclick = async () => {

        const yes =
          confirm(
            "Remove this application?"
          );

        if(!yes){
          return;
        }

        try{

          await api(
            "/api/applications/" +
            button.dataset.deleteApp,
            {
              method:"DELETE"
            }
          );

          await load();

          render();

          toast(
            "Application removed.",
            "success"
          );

        }catch(error){

          toast(
            "❌ " + error.message,
            "error"
          );

        }

      };

    });


  /* JOB SEARCH */

  const search =
    $("#jobSearch");

  const level =
    $("#jobLevel");

  const location =
    $("#jobLocation");

  const type =
    $("#jobType");


  if(search){

    const filterJobs = () => {

      const q =
        search.value
          .toLowerCase()
          .trim();

      const selectedLevel =
        level.value;

      const selectedLocation =
        location.value
          .toLowerCase()
          .trim();

      const selectedType =
        type.value;


      const filtered =
        jobs.filter(job => {

          const searchable =
            JSON.stringify(job)
              .toLowerCase();

          return (
            (!q ||
              searchable.includes(q)) &&

            (!selectedLevel ||
              job.level === selectedLevel) &&

            (!selectedLocation ||
              String(job.location || "")
                .toLowerCase()
                .includes(selectedLocation)) &&

            (!selectedType ||
              job.type === selectedType)
          );

        });


      $("#jobGrid").innerHTML =
        jobCards(filtered);

      wire();

    };


    search.oninput =
      filterJobs;

    level.onchange =
      filterJobs;

    location.oninput =
      filterJobs;

    type.onchange =
      filterJobs;

  }


  /* PROFILE */

  const profileForm =
    $("#profileForm");

  if(profileForm){

    profileForm.onsubmit =
      async event => {

        event.preventDefault();

        const data =
          Object.fromEntries(
            new FormData(profileForm)
          );

        try{

          const result =
            await api(
              "/api/profile",
              {
                method:"PUT",
                body:JSON.stringify(data)
              }
            );

          await load();

          toast(
            result.message ||
            "✅ Profile updated successfully!",
            "success"
          );

        }catch(error){

          toast(
            "❌ " + error.message,
            "error"
          );

        }

      };

  }


  /* RESUME */

  const resumeForm =
    $("#resumeForm");

  if(resumeForm){

    resumeForm.onsubmit =
      async event => {

        event.preventDefault();

        const formData =
          new FormData(resumeForm);

        try{

          const result =
            await api(
              "/api/resume",
              {
                method:"POST",
                body:formData
              }
            );

          const analysis =
            result.analysis;

          $("#resumeResult").innerHTML = `

            <div class="card"
                 style="padding:22px">

              <h2>
                Resume Analysis
              </h2>

              <div class="grid2">

                <div>

                  <div class="stat">

                    <span class="muted">
                      Resume Score
                    </span>

                    <strong>
                      ${analysis.score}/100
                    </strong>

                  </div>

                </div>


                <div>

                  <h3>
                    Suggestions
                  </h3>

                  ${
                    analysis.suggestions.length
                    ? `
                      <ul>
                        ${
                          analysis.suggestions
                            .map(
                              x =>
                                `<li>${esc(x)}</li>`
                            )
                            .join("")
                        }
                      </ul>
                    `
                    : `
                      <p class="muted">
                        No major issues found.
                      </p>
                    `
                  }

                </div>

              </div>

            </div>

          `;

          toast(
            result.message ||
            "✅ Resume analyzed successfully!",
            "success"
          );

        }catch(error){

          toast(
            "❌ " + error.message,
            "error"
          );

        }

      };

  }


  /* MOCK INTERVIEW */

  const interviewForm =
    $("#interviewForm");

  if(interviewForm){

    interviewForm.onsubmit =
      async event => {

        event.preventDefault();

        const data =
          new FormData(interviewForm);

        const role =
          data.get("role");

        const answers = [];

        for(let i=0;i<5;i++){

          answers.push(
            data.get("answer"+i) || ""
          );

        }

        try{

          const result =
            await api(
              "/api/interview",
              {
                method:"POST",
                body:JSON.stringify({
                  role,
                  answers
                })
              }
            );


          $("#interviewResult").innerHTML = `

            <div
              class="card"
              style="padding:22px"
            >

              <h2>
                Interview Result
              </h2>

              <div class="stat">

                <span class="muted">
                  Score
                </span>

                <strong>
                  ${result.score}/100
                </strong>

              </div>

              <p>
                ${esc(result.feedback)}
              </p>

              <p class="muted">
                Questions answered:
                ${result.answered}
              </p>

            </div>

          `;

          toast(
            result.message ||
            "✅ Mock interview completed!",
            "success"
          );

        }catch(error){

          toast(
            "❌ " + error.message,
            "error"
          );

        }

      };

  }


  /* RECRUITER JOB */

  const jobPostForm =
    $("#jobPostForm");

  if(jobPostForm){

    jobPostForm.onsubmit =
      async event => {

        event.preventDefault();

        const data =
          Object.fromEntries(
            new FormData(jobPostForm)
          );

        try{

          const result =
            await api(
              "/api/recruiter/jobs",
              {
                method:"POST",
                body:JSON.stringify(data)
              }
            );

          jobPostForm.reset();

          await load();

          toast(
            result.message ||
            "✅ Job posted successfully!",
            "success"
          );

        }catch(error){

          toast(
            "❌ " + error.message,
            "error"
          );

        }

      };


    loadRecruiterApplicants();

  }

}

async function loadRecruiterApplicants(){

  const box =
    $("#recruiterApplicants");

  if(!box){
    return;
  }

  try{

    const applicants =
      await api(
        "/api/recruiter/applications"
      );

    if(!applicants.length){

      box.innerHTML = `
        <div class="empty">
          No applicants yet.
        </div>
      `;

      return;
    }


    box.innerHTML =
      applicants.map(a => `

        <div class="list">

          <div>

            <strong>
              ${esc(a.name)}
            </strong>

            <div class="small muted">
              ${esc(a.email)}
            </div>

            <div class="small">
              ${esc(a.title)}
            </div>

          </div>


          <span class="status">
            ${esc(a.status)}
          </span>

        </div>

      `).join("");

  }catch(error){

    box.innerHTML = `
      <div class="notice">
        ${esc(error.message)}
      </div>
    `;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(showMessage=true){

  token = "";

  user = null;

  profile = {};

  jobs = [];

  saved = [];

  apps = [];

  localStorage.removeItem(
    "cnToken"
  );

  if(showMessage){

    toast(
      "Logged out successfully.",
      "success"
    );

  }

  auth("login");
}


/* =====================================================
   START APPLICATION
===================================================== */

async function startApp(){

  if(!token){

    auth("login");

    return;
  }

  try{

    await load();

    if(!user){

      auth("login");

      return;
    }

    render();

  }catch(error){

    console.error(error);

    auth("login");

  }
}


/* =====================================================
   START
===================================================== */

startApp();

</script>
