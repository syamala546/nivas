<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CareerNexa</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f8f7ff;
  color:#242338;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:linear-gradient(180deg,#8f2cff,#ff3f81);
  color:white;
  padding:25px 18px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow:auto;
}

.logo{
  font-size:27px;
  font-weight:900;
  margin-bottom:30px;
}

.logo span{
  color:#ffd6eb;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav button{
  border:0;
  background:transparent;
  color:white;
  text-align:left;
  padding:13px 15px;
  border-radius:12px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:rgba(255,255,255,.2);
}

.logout{
  margin-top:30px;
  background:rgba(0,0,0,.2)!important;
}

/* MAIN */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar{
  background:white;
  padding:18px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:5;
}

.userbox{
  font-weight:700;
}

/* CONTENT */

.content{
  padding:30px;
  max-width:1400px;
  margin:auto;
}

.hero{
  background:linear-gradient(135deg,#812cff,#ff4e8c);
  color:white;
  border-radius:25px;
  padding:38px;
  margin-bottom:25px;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  opacity:.9;
  font-size:17px;
}

.search{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.search input{
  flex:1;
  padding:15px;
  border:0;
  border-radius:12px;
  outline:0;
}

/* CARDS */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.card{
  background:white;
  border:1px solid #eee;
  border-radius:18px;
  padding:22px;
  box-shadow:0 8px 25px rgba(60,30,100,.06);
}

.card h3{
  margin-bottom:8px;
}

.muted{
  color:#777;
  font-size:14px;
}

.tag{
  display:inline-block;
  background:#f0e8ff;
  color:#6d20c9;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  margin:5px 4px 5px 0;
}

.btn{
  border:0;
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
  margin-top:12px;
}

.primary{
  background:#ff3f81;
  color:white;
}

.secondary{
  background:#eee7ff;
  color:#6723c5;
}

.success{
  background:#e4faed;
  color:#08783d;
}

.danger{
  background:#ffe7e7;
  color:#b32121;
}

/* FORMS */

.form{
  background:white;
  padding:25px;
  border-radius:18px;
  max-width:700px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-weight:700;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modalbox{
  width:100%;
  max-width:480px;
  background:white;
  padding:30px;
  border-radius:20px;
  max-height:90vh;
  overflow:auto;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#eee;
}

.tabs button.active{
  background:#ff3f81;
  color:white;
}

/* TOAST */

#toast{
  position:fixed;
  right:25px;
  bottom:25px;
  background:#222;
  color:white;
  padding:14px 20px;
  border-radius:12px;
  display:none;
  z-index:200;
}

#toast.show{
  display:block;
}

/* MOBILE */

@media(max-width:800px){

.sidebar{
  width:75px;
  padding:20px 8px;
}

.logo{
  font-size:18px;
  text-align:center;
}

.nav button{
  font-size:0;
  text-align:center;
}

.nav button::first-letter{
  font-size:20px;
}

.main{
  margin-left:75px;
  width:calc(100% - 75px);
}

.content{
  padding:18px;
}

.hero h1{
  font-size:28px;
}

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
Career<span>Nexa</span>
</div>

<div class="nav">

<button class="active" onclick="showPage('home',this)">
🏠 Home
</button>

<button onclick="showPage('jobs',this)">
💼 Jobs
</button>

<button onclick="showPage('applications',this)">
📋 Applications
</button>

<button onclick="showPage('saved',this)">
❤️ Saved Jobs
</button>

<button onclick="showPage('profile',this)">
👤 Profile
</button>

<button onclick="showPage('resume',this)">
📄 Resume Analyzer
</button>

<button onclick="showPage('interview',this)">
🎤 Mock Interview
</button>

<button id="recruiterNav"
style="display:none"
onclick="showPage('recruiter',this)">
🏢 Recruiter
</button>

<button id="adminNav"
style="display:none"
onclick="showPage('admin',this)">
🛡️ Admin
</button>

<button class="logout" onclick="logout()">
🚪 Logout
</button>

</div>

</aside>

<main class="main">

<header class="topbar">

<div>
<strong>CareerNexa</strong>
</div>

<div class="userbox" id="userBox">
Not logged in
</div>

</header>

<div class="content" id="content"></div>

</main>

</div>


<!-- LOGIN / REGISTER -->

<div class="modal" id="authModal">

<div class="modalbox">

<h2 style="margin-bottom:20px">
Welcome to CareerNexa
</h2>

<div class="tabs">

<button
id="loginTab"
class="active"
onclick="switchAuth('login')">
Login
</button>

<button
id="registerTab"
onclick="switchAuth('register')">
Create Account
</button>

</div>


<!-- LOGIN -->

<div id="loginForm">

<div class="field">
<label>Email</label>
<input
id="loginEmail"
type="email"
placeholder="Enter email">
</div>

<div class="field">
<label>Password</label>
<input
id="loginPassword"
type="password"
placeholder="Enter password">
</div>

<button
class="btn primary"
onclick="login()">
Login
</button>

</div>


<!-- REGISTER -->

<div id="registerForm" style="display:none">

<div class="field">
<label>Name</label>
<input
id="regName"
placeholder="Your full name">
</div>

<div class="field">
<label>Mobile Number</label>
<input
id="regMobile"
placeholder="10 digit mobile number">
</div>

<div class="field">
<label>Email</label>
<input
id="regEmail"
type="email"
placeholder="Email address">
</div>

<div class="field">
<label>Password</label>
<input
id="regPassword"
type="password"
placeholder="Minimum 6 characters">
</div>

<div class="field">

<label>Account Type</label>

<select id="regRole">

<option value="candidate">
Candidate / Job Seeker
</option>

<option value="recruiter">
Recruiter / Company
</option>

</select>

</div>

<button
class="btn primary"
onclick="register()">
Create Account
</button>

</div>

</div>

</div>

<div id="toast"></div>


<script>

let token = localStorage.getItem("cn_token");

let me = null;
let jobs = [];
let saved = [];
let applications = [];


/* =====================================================
API
===================================================== */

async function api(url,options={}){

  const headers = options.headers || {};

  if(!(options.body instanceof FormData)){
    headers["Content-Type"] =
      headers["Content-Type"] ||
      "application/json";
  }

  if(token){
    headers.Authorization =
      "Bearer " + token;
  }

  const response =
    await fetch(url,{
      ...options,
      headers
    });

  const text =
    await response.text();

  let data={};

  try{
    data =
      text ? JSON.parse(text) : {};
  }
  catch{
    data={error:text};
  }

  if(!response.ok){
    throw new Error(
      data.error ||
      "Something went wrong"
    );
  }

  return data;
}


/* =====================================================
TOAST
===================================================== */

function toast(message){

  const box =
    document.getElementById("toast");

  box.textContent = message;

  box.classList.add("show");

  setTimeout(()=>{
    box.classList.remove("show");
  },3500);

}


/* =====================================================
INIT
===================================================== */

async function init(){

  if(!token){

    document
      .getElementById("authModal")
      .classList.add("show");

    renderWelcome();

    return;
  }

  try{

    me =
      await api("/api/me");

    await loadData();

    updateUser();

    setupRoleNav();

    showPage("home");

  }
  catch(error){

    console.error(error);

    logout();

  }

}


async function loadData(){

  jobs =
    await api("/api/jobs");

  if(me.role === "candidate"){

    saved =
      await api("/api/saved");

    applications =
      await api("/api/applications");

  }

}


/* =====================================================
WELCOME
===================================================== */

function renderWelcome(){

  document.getElementById("content").innerHTML = `

    <section class="hero">

      <h1>
        Welcome to CareerNexa 🚀
      </h1>

      <p>
        Your complete career platform for finding jobs,
        applying to companies, tracking applications
        and preparing for interviews.
      </p>

      <button
        class="btn primary"
        onclick="document.getElementById('authModal').classList.add('show')">

        Login / Create Account

      </button>

    </section>

    <div class="grid">

      <div class="card">
        <h3>💼 Real Jobs</h3>
        <p class="muted">
          Discover job opportunities posted on CareerNexa.
        </p>
      </div>

      <div class="card">
        <h3>📋 Application Tracker</h3>
        <p class="muted">
          Track your application status from Applied
          to Interview and Selection.
        </p>
      </div>

      <div class="card">
        <h3>📄 Resume Analyzer</h3>
        <p class="muted">
          Upload your resume and identify areas
          that can be improved.
        </p>
      </div>

      <div class="card">
        <h3>🎤 Mock Interview</h3>
        <p class="muted">
          Practice interview questions before the real interview.
        </p>
      </div>

    </div>

  `;

}


/* =====================================================
AUTH
===================================================== */

function switchAuth(type){

  document.getElementById("loginForm").style.display =
    type === "login"
    ? "block"
    : "none";

  document.getElementById("registerForm").style.display =
    type === "register"
    ? "block"
    : "none";

  document
    .getElementById("loginTab")
    .classList.toggle(
      "active",
      type === "login"
    );

  document
    .getElementById("registerTab")
    .classList.toggle(
      "active",
      type === "register"
    );

}


async function login(){

  try{

    const data =
      await api("/api/login",{
        method:"POST",
        body:JSON.stringify({

          email:
            document
              .getElementById("loginEmail")
              .value,

          password:
            document
              .getElementById("loginPassword")
              .value

        })
      });

    token =
      data.token;

    localStorage.setItem(
      "cn_token",
      token
    );

    me =
      data.user;

    document
      .getElementById("authModal")
      .classList.remove("show");

    await loadData();

    updateUser();

    setupRoleNav();

    showPage("home");

    toast("✅ Login successful");

  }
  catch(error){

    toast("❌ " + error.message);

  }

}


async function register(){

  try{

    const data =
      await api("/api/register",{
        method:"POST",
        body:JSON.stringify({

          name:
            document
              .getElementById("regName")
              .value,

          mobile:
            document
              .getElementById("regMobile")
              .value,

          email:
            document
              .getElementById("regEmail")
              .value,

          password:
            document
              .getElementById("regPassword")
              .value,

          role:
            document
              .getElementById("regRole")
              .value

        })
      });

    token =
      data.token;

    localStorage.setItem(
      "cn_token",
      token
    );

    me =
      data.user;

    document
      .getElementById("authModal")
      .classList.remove("show");

    await loadData();

    updateUser();

    setupRoleNav();

    showPage("home");

    toast("🎉 Account created successfully");

  }
  catch(error){

    toast("❌ " + error.message);

  }

}


function logout(){

  localStorage.removeItem(
    "cn_token"
  );

  token=null;
  me=null;

  location.reload();

}


function updateUser(){

  document
    .getElementById("userBox")
    .textContent =
      me
      ? `${me.name} • ${me.role}`
      : "Not logged in";

}


function setupRoleNav(){

  document
    .getElementById("recruiterNav")
    .style.display =
      me.role === "recruiter"
      ? "block"
      : "none";

  document
    .getElementById("adminNav")
    .style.display =
      me.role === "admin"
      ? "block"
      : "none";

}


/* =====================================================
NAVIGATION
===================================================== */

function showPage(page,button){

  if(!me){
    document
      .getElementById("authModal")
      .classList.add("show");

    return;
  }

  if(button){

    document
      .querySelectorAll(".nav button")
      .forEach(x=>
        x.classList.remove("active")
      );

    button.classList.add("active");

  }

  if(page==="home")
    renderHome();

  if(page==="jobs")
    renderJobs();

  if(page==="applications")
    renderApplications();

  if(page==="saved")
    renderSaved();

  if(page==="profile")
    renderProfile();

  if(page==="resume")
    renderResume();

  if(page==="interview")
    renderInterview();

  if(page==="recruiter")
    renderRecruiter();

  if(page==="admin")
    renderAdmin();

}


/* =====================================================
HOME
===================================================== */

function renderHome(){

  document
    .getElementById("content")
    .innerHTML = `

      <section class="hero">

        <h1>
          Build your career with CareerNexa 🚀
        </h1>

        <p>
          Find opportunities, apply to companies,
          track applications and prepare for interviews.
        </p>

        <div class="search">

          <input
            id="homeSearch"
            placeholder="Search jobs, skills, companies...">

          <button
            class="btn primary"
            onclick="searchHome()">

            Search Jobs

          </button>

        </div>

      </section>


      <h2 style="margin-bottom:18px">
        Latest Jobs
      </h2>


      <div class="grid">

        ${
          jobs
            .slice(0,6)
            .map(jobCard)
            .join("")
        }

      </div>

    `;

}


function searchHome(){

  const value =
    document
      .getElementById("homeSearch")
      .value;

  renderJobs(value);

}


/* =====================================================
JOBS
===================================================== */

function renderJobs(search=""){

  const filtered =
    jobs.filter(job=>{

      if(!search)
        return true;

      const text =
        `
        ${job.title}
        ${job.company}
        ${job.skills}
        ${job.location}
        `
        .toLowerCase();

      return text.includes(
        search.toLowerCase()
      );

    });


  document
    .getElementById("content")
    .innerHTML = `

      <h1 style="margin-bottom:20px">
        Find Jobs 💼
      </h1>


      <div
        class="card"
        style="margin-bottom:20px">

        <input
          id="jobSearch"
          value="${escapeHtml(search)}"
          oninput="renderJobs(this.value)"
          placeholder="Search by role, company, skill or location..."
          style="
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
          ">

      </div>


      <div class="grid">

        ${
          filtered.length
          ? filtered.map(jobCard).join("")
          : `
            <div class="card">

              <h3>
                No jobs found
              </h3>

              <p class="muted">
                Try another search.
              </p>

            </div>
          `
        }

      </div>

    `;

}


function jobCard(job){

  const isSaved =
    saved.includes(
      Number(job.id)
    );

  const applied =
    applications.some(
      a =>
        Number(a.job_id) ===
        Number(job.id)
    );


  return `

    <div class="card">

      <h3>
        ${escapeHtml(job.title)}
      </h3>

      <p>
        🏢
        ${escapeHtml(job.company)}
      </p>

      <p class="muted">
        📍
        ${escapeHtml(
          job.location ||
          "Not specified"
        )}
      </p>

      <p class="muted">
        💰
        ${escapeHtml(
          job.salary ||
          "Salary not disclosed"
        )}
      </p>


      <div>

        <span class="tag">
          ${escapeHtml(
            job.level ||
            "Fresher"
          )}
        </span>

        <span class="tag">
          ${escapeHtml(
            job.type ||
            "Full Time"
          )}
        </span>

      </div>


      <p style="margin-top:10px">
        ${escapeHtml(
          job.description ||
          ""
        )}
      </p>


      <p style="margin-top:10px">

        <strong>
          Skills:
        </strong>

        ${escapeHtml(
          job.skills ||
          "Not specified"
        )}

      </p>


      ${
        me.role === "candidate"
        ? `

          <button
            class="btn secondary"
            onclick="saveJob(${job.id})">

            ${
              isSaved
              ? "❤️ Saved"
              : "🤍 Save"
            }

          </button>


          <button
            class="btn primary"
            onclick="applyJob(${job.id},this)"
            ${applied ? "disabled" : ""}>

            ${
              applied
              ? "✅ Applied"
              : "Apply Now"
            }

          </button>

        `
        : ""
      }

    </div>

  `;

}


/* =====================================================
APPLY
===================================================== */

async function applyJob(jobId,button){

  try{

    button.disabled=true;

    button.textContent=
      "Applying...";


    const result =
      await api(
        "/api/applications/" +
        jobId,
        {
          method:"POST"
        }
      );


    await loadData();


    toast(
      result.smsSent
      ? "✅ Applied! SMS sent to your mobile."
      : "✅ Application submitted."
    );


    renderJobs();

  }
  catch(error){

    button.disabled=false;

    button.textContent=
      "Apply Now";

    toast(
      "❌ " +
      error.message
    );

  }

}


/* =====================================================
SAVE
===================================================== */

async function saveJob(jobId){

  try{

    const result =
      await api(
        "/api/saved/" +
        jobId,
        {
          method:"POST"
        }
      );


    await loadData();


    toast(
      result.saved
      ? "❤️ Job saved"
      : "Job removed from saved"
    );


    renderJobs();

  }
  catch(error){

    toast(
      "❌ " +
      error.message
    );

  }

}


/* =====================================================
APPLICATIONS
===================================================== */

function renderApplications(){

  document
    .getElementById("content")
    .innerHTML = `

      <h1 style="margin-bottom:20px">
        Application Tracker 📋
      </h1>


      <div class="grid">

        ${
          applications.length
          ? applications
              .map(applicationCard)
              .join("")
          : `

            <div class="card">

              <h3>
                No applications yet
              </h3>

              <p class="muted">
                Apply to a job to start tracking
                your career journey.
              </p>

            </div>

          `
        }

      </div>

    `;

}


function applicationCard(a){

  return `

    <div class="card">

      <h3>
        ${escapeHtml(a.title)}
      </h3>

      <p>
        🏢
        ${escapeHtml(a.company)}
      </p>

      <p class="muted">
        📍
        ${escapeHtml(
          a.location || ""
        )}
      </p>


      <div style="margin-top:15px">

        <span class="tag">
          ${escapeHtml(a.status)}
        </span>

      </div>


      <p
        class="muted"
        style="margin-top:10px">

        Applied:
        ${new Date(
          a.created_at
        ).toLocaleString()}

      </p>


      ${
        a.recruiter_note
        ? `

          <div
            class="card"
            style="
              margin-top:12px;
              background:#faf7ff;
            ">

            <strong>
              Recruiter note
            </strong>

            <p>
              ${escapeHtml(
                a.recruiter_note
              )}
            </p>

          </div>

        `
        : ""
      }

    </div>

  `;

}


/* =====================================================
SAVED
===================================================== */

function renderSaved(){

  const savedJobs =
    jobs.filter(
      j =>
        saved.includes(
          Number(j.id)
        )
    );


  document
    .getElementById("content")
    .innerHTML = `

      <h1 style="margin-bottom:20px">
        Saved Jobs ❤️
      </h1>


      <div class="grid">

        ${
          savedJobs.length
          ? savedJobs
              .map(jobCard)
              .join("")
          : `

            <div class="card">

              <h3>
                No saved jobs
              </h3>

              <p class="muted">
                Save interesting jobs
                and find them here.
              </p>

            </div>

          `
        }

      </div>

    `;

}


/* =====================================================
PROFILE
===================================================== */

async function renderProfile(){

  try{

    const profile =
      await api("/api/profile");


    document
      .getElementById("content")

function renderResume(){

  document
    .getElementById("content")
    .innerHTML = `

      <h1 style="margin-bottom:20px">
        Resume Analyzer 📄
      </h1>


      <div class="card">

        <p class="muted">

          Upload your resume and CareerNexa
          will identify common improvement areas.

        </p>


        <div style="margin-top:20px">

          <input
            id="resumeFile"
            type="file"
            accept=".pdf,.doc,.docx">

        </div>


        <button
          class="btn primary"
          onclick="uploadResume()">

          Analyze Resume

        </button>


        <div
          id="resumeResult"
          style="margin-top:20px">

        </div>

      </div>

  `;

}


async function uploadResume(){

  const file =
    document
      .getElementById("resumeFile")
      .files[0];


  if(!file){

    toast(
      "Please select a resume"
    );

    return;

  }


  const formData =
    new FormData();

  formData.append(
    "resume",
    file
  );


  try{

    const response =
      await fetch(
        "/api/resume",
        {
          method:"POST",

          headers:{
            Authorization:
              "Bearer " +
              token
          },

          body:formData
        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error
      );

    }


    document
      .getElementById("resumeResult")
      .innerHTML = `

        <div class="card">

          <h2>
            Resume Score:
            ${result.analysis.score}/100
          </h2>


          <h3 style="margin-top:15px">
            Strengths
          </h3>

          <ul>

            ${
              result.analysis.strengths
                .map(
                  x =>
                    `<li>${escapeHtml(x)}</li>`
                )
                .join("")
            }

          </ul>


          <h3 style="margin-top:15px">
            Issues
          </h3>

          <ul>

            ${
              result.analysis.issues
                .map(
                  x =>
                    `<li>${escapeHtml(x)}</li>`
                )
                .join("")
            }

          </ul>


          <h3 style="margin-top:15px">
            Suggestions
          </h3>

          <ul>

            ${
              result.analysis.suggestions
                .map(
                  x =>
                    `<li>${escapeHtml(x)}</li>`
                )
                .join("")
            }

          </ul>

        </div>

      `;

  }
  catch(error){

    toast(
      "❌ " +
      error.message
    );

  }

}

async function postJob(){

              .getElementById("jTitle")

              .value,

              .value,

              .value,

              .getElementById("jSalary")

function recruiterApplicant(a){

  return `

    <div class="card">

      <h3>
        ${escapeHtml(
          a.candidate_name
        )}
      </h3>


      <p>

        Applied for:
        <strong>
          ${escapeHtml(
            a.job_title
          )}
        </strong>

      </p>


      <p class="muted">
        📧
        ${escapeHtml(
          a.candidate_email
        )}
      </p>


      <p class="muted">
        📱
        ${escapeHtml(
          a.candidate_mobile ||
          ""
        )}
      </p>


      <p>

        <strong>
          Skills:
        </strong>

        ${escapeHtml(
          a.skills ||
          "Not provided"
        )}

      </p>


      <p>

        <strong>
          Experience:
        </strong>

        ${escapeHtml(
          a.experience ||
          "Not provided"
        )}

      </p>


      <span class="tag">
        ${escapeHtml(
          a.status
        )}
      </span>


      <div style="margin-top:10px">

        <select id="status-${a.id}">

          <option>
            Applied
          </option>

          <option>
            Under Review
          </option>

          <option>
            Shortlisted
          </option>

          <option>
            Assessment
          </option>

          <option>
            Interview Scheduled
          </option>

          <option>
            Selected
          </option>

          <option>
            Rejected
          </option>

        </select>


        <button
          class="btn primary"
          onclick="updateApplicant(${a.id})">

          Update Status

        </button>


        <button
          class="btn secondary"
          onclick="scheduleInterview(${a.id})">

          Schedule Interview

        </button>

      </div>

    </div>

  `;

}


async function updateApplicant(id){

  const status =
    document
      .getElementById(
        "status-" + id
      )
      .value;


  try{

    const result =
      await api(
        "/api/recruiter/applications/" +
        id,
        {
          method:"PATCH",

          body:JSON.stringify({
            status
          })
        }
      );


    toast(
      result.smsSent
      ? "✅ Status updated + SMS sent"
      : "✅ Status updated"
    );


    renderRecruiter();

  }
  catch(error){

    toast(
      "❌ " +
      error.message
    );

  }

}


async function scheduleInterview(id){

  const date =
    prompt(
      "Enter interview date/time\nExample: 2026-10-15T15:00"
    );


  if(!date)
    return;


  const mode =
    prompt(
      "Mode: Online / Offline",
      "Online"
    );


  const link =
    prompt(
      "Meeting link (optional)"
    );


  try{

    const result =
      await api(
        "/api/recruiter/applications/" +
        id +
        "/interview",
        {
          method:"POST",

          body:JSON.stringify({

            scheduled_at:
              date,

            mode:
              mode ||
              "Online",

            meeting_link:
              link ||
              "",

            note:
              "Interview scheduled by recruiter"

          })
        }
      );


    toast(
      result.smsSent
      ? "📅 Interview scheduled + SMS sent"
      : "📅 Interview scheduled"
    );


    renderRecruiter();

  }
  catch(error){

    toast(
      "❌ " +
      error.message
    );

  }

}

async function renderAdmin(){

  try{

    const jobs =

    document
      .getElementById("content")

        <h1 style="margin-bottom:20px">
          Admin Dashboard 🛡️
        </h1>


        <div class="grid">

          ${

              .join("")
          }

        </div>

      `;

  }
  catch(error){

    toast(
      "❌ " +
      error.message
    );

  }

}


function adminJob(job){

  return `

    <div class="card">

      <h3>
        ${escapeHtml(
          job.title
        )}
      </h3>


      <p>
        🏢
        ${escapeHtml(
          job.company
        )}
      </p>


      <p class="muted">

        Recruiter:
        ${escapeHtml(
          job.recruiter_name ||
          "Admin"
        )}

      </p>


      <span class="tag">
        ${escapeHtml(
          job.status
        )}
      </span>


      <div>

        <button
          class="btn success"
          onclick="reviewJob(${job.id},'approved')">

          Approve

        </button>


        <button
          class="btn danger"
          onclick="reviewJob(${job.id},'rejected')">

          Reject

        </button>

      </div>

    </div>

  `;

}


async function reviewJob(id,status){

  try{

    await api(
      "/api/admin/jobs/" +
      id,
      {
        method:"PATCH",

        body:JSON.stringify({
          status
        })
      }
    );


    toast(
      status === "approved"
      ? "✅ Job approved"
      : "❌ Job rejected"
    );


    renderAdmin();

  }
  catch(error){

    toast(
      "❌ " +
      error.message
    );

  }

}


/* =====================================================
HELPERS
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}
