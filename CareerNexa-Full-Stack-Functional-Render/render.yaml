services:
  - type: web
    name: careernexa
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careernexa-db
          property: connectionString
databases:
  - name: careernexa-db
    plan: free
    databaseName: careernexa
    user: careernexa_user
